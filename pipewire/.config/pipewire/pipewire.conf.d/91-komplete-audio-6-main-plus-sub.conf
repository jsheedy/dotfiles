# Present one ordinary stereo sink to applications, then map it to the
# Komplete Audio 6 MK2's physical outputs: L -> 1, R -> 2, (L + R) / 2 -> 3.
context.modules = [
  {
    name = libpipewire-module-filter-chain
    args = {
      node.description = "Komplete Audio 6 1/2 + Mono Sub (Output 3)"
      node.name = "komplete_audio_6_main_plus_sub"
      media.name = "Komplete Audio 6 1/2 + Mono Sub (Output 3)"

      filter.graph = {
        nodes = [
          { name = left_in  type = builtin label = copy }
          { name = left_out type = builtin label = copy }
          { name = right_in  type = builtin label = copy }
          { name = right_out type = builtin label = copy }
          {
            name = mono
            type = builtin
            label = mixer
            control = {
              "Gain 1" = 0.5
              "Gain 2" = 0.5
            }
          }
        ]
        links = [
          { output = "left_in:Out"  input = "left_out:In" }
          { output = "right_in:Out" input = "right_out:In" }
          { output = "left_in:Out"  input = "mono:In 1" }
          { output = "right_in:Out" input = "mono:In 2" }
        ]
        inputs = [ "left_in:In" "right_in:In" ]
        outputs = [ "left_out:Out" "right_out:Out" "mono:Out" ]
      }

      capture.props = {
        node.name = "komplete_audio_6_main_plus_sub"
        media.class = "Audio/Sink"
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name = "komplete_audio_6_main_plus_sub_output"
        target.object = "alsa_output.usb-Native_Instruments_Komplete_Audio_6_MK2_BE1EB8C5-00.pro-output-0"
        # Never fall back to another sound card when the Komplete target is absent.
        node.dont-fallback = true
        node.linger = true
        audio.position = [ AUX0 AUX1 AUX2 ]
        stream.dont-remix = true
        node.passive = true
      }
    }
  }
]
